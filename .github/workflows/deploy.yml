name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: benefitsbridge-491606
  SERVICE_NAME: benefits-bridge
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Auth with Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
        service_account: github-deployer@benefitsbridge-491606.iam.gserviceaccount.com

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker
      run: |
        gcloud auth configure-docker us-central1-docker.pkg.dev

    - name: Build and Push Container
      run: |
        # Create Artifact Registry repository if it doesn't exist
        gcloud artifacts repositories describe $SERVICE_NAME --location=$REGION --project=$PROJECT_ID || \
        gcloud artifacts repositories create $SERVICE_NAME --repository-format=docker --location=$REGION --description="BenefitsBridge Docker Repository" --project=$PROJECT_ID
        
        # Build the image
        IMAGE_NAME="us-central1-docker.pkg.dev/$PROJECT_ID/$SERVICE_NAME/$SERVICE_NAME:${{ github.sha }}"
        docker build -t $IMAGE_NAME .
        
        # Push the image
        docker push $IMAGE_NAME

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy $SERVICE_NAME \
          --image us-central1-docker.pkg.dev/$PROJECT_ID/$SERVICE_NAME/$SERVICE_NAME:${{ github.sha }} \
          --region $REGION \
          --platform managed \
          --allow-unauthenticated \
          --project $PROJECT_ID
